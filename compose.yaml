# Prisma corre en una VPS compartida con otro proyecto crítico.
# Todo lo de acá está pensado para que Prisma NUNCA pueda afectarlo:
#   - Proyecto, red y volúmenes propios (nombre "prisma").
#   - Sin puertos publicados: los servicios solo se ven entre sí y salen a internet.
#   - Límites duros de memoria, CPU y procesos.
#   - oom_score_adj alto: si el servidor se queda sin RAM, el kernel mata primero a Prisma.
# Ver docs/adr/0003-aislamiento-en-la-vps.md

name: prisma

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  oom_score_adj: 800
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  bot:
    <<: *hardening
    build: .
    image: prisma-bot:latest
    env_file: .env
    environment:
      LAVALINK_HOST: lavalink
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      lavalink:
        condition: service_healthy
      tts:
        condition: service_started

  lavalink:
    <<: *hardening
    build: ./lavalink
    image: prisma-lavalink:latest
    # Solo las variables que Lavalink necesita (el token de Discord no llega a este contenedor).
    environment:
      _JAVA_OPTIONS: -Xmx512m -XX:+UseG1GC
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Falta LAVALINK_PASSWORD en .env}
    read_only: true
    # Java extrae librerías nativas (audio, cifrado DAVE) en /tmp: necesita permiso de ejecución.
    tmpfs: ['/tmp:exec,size=128m']
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512

  # Texto a voz (Piper). Solo trabaja mientras Prisma habla; el resto del tiempo está en reposo.
  tts:
    <<: *hardening
    build:
      context: ./tts
      args:
        PIPER_VOICE: ${PIPER_VOICE:-es_AR-daniela-high}
    image: prisma-tts:latest
    environment:
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-0.95}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 128
